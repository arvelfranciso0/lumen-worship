# Builds the Windows installer and publishes it to the lumen-worship-release repo.
# Versions with a pre-release suffix (e.g. 0.1.2-beta.1) publish to the beta channel.
# Runs on every push to develop, but skips when the current version is already published.
name: Release

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version is already published
        id: status
        run: |
          status=$(node scripts/github-release.mjs status)
          echo "name=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "published" ]; then
            echo "v$(node -p "require('./package.json').version") is already published; bump the version in package.json to release."
          fi

      - uses: actions/setup-node@v4
        if: steps.status.outputs.name != 'published'
        with:
          node-version: 24
          cache: npm

      - if: steps.status.outputs.name != 'published'
        run: npm ci

      - name: Detect channel from version
        if: steps.status.outputs.name != 'published'
        id: channel
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then channel=beta; else channel=stable; fi
          echo "name=$channel" >> "$GITHUB_OUTPUT"
          echo "Releasing $version on the $channel channel"

      - name: Create draft release
        if: steps.status.outputs.name != 'published'
        run: |
          if [ "${{ steps.channel.outputs.name }}" = "beta" ]; then
            node scripts/github-release.mjs draft release-notes-beta.md --prerelease
          else
            node scripts/github-release.mjs draft release-notes.md
          fi

      - name: Build and upload installer
        if: steps.status.outputs.name != 'published'
        run: |
          if [ "${{ steps.channel.outputs.name }}" = "beta" ]; then
            npm run electron:build -- --publish always -c.publish.channel=beta
          else
            npm run electron:build -- --publish always
          fi

      - name: Publish release
        if: steps.status.outputs.name != 'published'
        run: node scripts/github-release.mjs publish
